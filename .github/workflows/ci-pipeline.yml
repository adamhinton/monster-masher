# This generates up-to-date backend types from our OpenAPI schema, and verifies that our Zod schemas match the OpenAPI types.
# Ideally I will have done this in dev alreasy, but it's a manual process and I can easily forget.

name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: OpenAPI Type Contract matches manually-written Zod Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install Backend Dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r backend/requirements.txt

      - name: Generate Backend Schema
        run: |
          source .venv/bin/activate
          cd backend
          python manage.py spectacular --file openapi.yaml

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Generate Frontend Types
        run: |
          cd frontend
          npm run generate:api

      - name: Run TypeScript Type Checks
        run: |
          cd frontend
          npm run build

      - name: Run Backend Tests
        run: |
          source .venv/bin/activate
          cd backend
          python manage.py test

      - name: Run Frontend Linting
        run: |
          cd frontend
          npm run lint
